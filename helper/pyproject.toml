[project]
name = "thumbtalk-helper"
version = "0.8.0"
description = "ThumbTalk: free local multilingual voice-to-chat for World of Warcraft"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygame-ce>=2.5",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "packaging>=24",
    "certifi>=2024.2.2",
    "faster-whisper>=1.1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "pynput>=1.8",
    "PySide6-Essentials>=6.8",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
thumbtalk-helper = "thumbtalk_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["thumbtalk_*.py"]

[dependency-groups]
build = ["pyinstaller>=6.16"]
