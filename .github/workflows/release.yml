name: Build release bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      THUMBTALK_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip libportaudio2 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 desktop-file-utils gcc libc6-dev linux-libc-dev libegl1 libgl1 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb xauth
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - run: uv sync --project helper --python 3.12 --group build --frozen
      - name: Python tests
        timeout-minutes: 5
        run: uv run --project helper python -m unittest discover -s tests -v
      - run: uv run --project helper python packaging/build.py
      - name: Check Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          desktop-file-validate Install-ThumbTalk.desktop packaging/Install-ThumbTalk-Local.desktop
          unzip -q dist/release/ThumbTalk-*-linux.zip -d "$RUNNER_TEMP/offline package"
          bash "$RUNNER_TEMP"/offline\ package/ThumbTalk-*-linux/install-local.sh --prefix "$RUNNER_TEMP/thumbtalk" --no-launch --no-shortcuts
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/thumbtalk/app/thumbtalk" --self-test
          xvfb-run -a env QT_QPA_PLATFORM=xcb PYNPUT_BACKEND=xorg "$RUNNER_TEMP/thumbtalk/app/thumbtalk" --self-test
      - name: Check Windows portable installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          ./install.ps1 -Bundle "$PWD/dist/thumbtalk" -InstallDir "$env:RUNNER_TEMP/ThumbTalkPortable" -NoLaunch -NoShortcuts
          & "$env:RUNNER_TEMP/ThumbTalkPortable/app/thumbtalk.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke check failed" }
      - name: Check Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $target = "$env:RUNNER_TEMP/ThumbTalkSetup"
          $process = Start-Process -FilePath "./dist/release/thumbtalk-windows-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows setup failed" }
          & "$target/app/thumbtalk.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Setup app smoke check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: thumbtalk-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: thumbtalk-*
          merge-multiple: true
          path: artifacts
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          title="ThumbTalk $RELEASE_TAG"
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            flags+=(--prerelease --latest=false)
            title="$title — Preview"
          fi
          notes="See the README for installation, controls and known limitations."
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            notes="Preview/beta for feedback. Windows handheld verification is ongoing; 1.0 is reserved for stable. $notes"
          fi
          gh release create "$RELEASE_TAG" artifacts/* --draft --verify-tag \
            "${flags[@]}" --title "$title" --notes "$notes"
